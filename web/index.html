<!doctype html>
<html>
    <head>
        <!--
    Base href is replaced automatically by Flutter during build.
    Do NOT hardcode it.
  -->
        <base href="$FLUTTER_BASE_HREF" />

        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

        <!-- Primary metadata -->
        <title>Certification</title>
        <meta
            name="description"
            content="Turn what you learn into quizzes and shareable certifications."
        />

        <!-- Mobile / PWA -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Certification" />

        <!-- Icons -->
        <link rel="apple-touch-icon" href="icons/Icon-192.png" />
        <link rel="icon" type="image/png" href="favicon.png" />
        <link rel="manifest" href="manifest.json" />

        <!-- Open Graph (WhatsApp, Facebook, LinkedIn, iMessage) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Certification" />
        <meta property="og:title" content="Certification" />
        <meta
            property="og:description"
            content="Turn what you learn into quizzes and shareable certifications."
        />
        <meta property="og:url" content="https://certification.asodya.com/" />
        <meta
            property="og:image"
            content="https://certification.asodya.com/og/preview-1200x630.png"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />

        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Certification" />
        <meta
            name="twitter:description"
            content="Turn what you learn into quizzes and shareable certifications."
        />
        <meta
            name="twitter:image"
            content="https://certification.asodya.com/og/preview-1200x630.png"
        />
        <style>
            :root {
                color-scheme: light dark;
                --brand-bg: #0b0f17;
                --brand-primary: #4aa7ff;
                --brand-secondary: #6ee7b7;
                --brand-accent: #f4b942;
                --brand-surface: rgba(10, 16, 28, 0.78);
                --brand-stroke: rgba(255, 255, 255, 0.12);
                --brand-text: #f4f8ff;
                --brand-muted: rgba(244, 248, 255, 0.72);
            }

            * { box-sizing: border-box; }

            html, body {
                margin: 0;
                min-height: 100%;
                background:
                    radial-gradient(circle at 18% 18%, rgba(74, 167, 255, 0.28), transparent 22%),
                    radial-gradient(circle at 80% 20%, rgba(110, 231, 183, 0.18), transparent 18%),
                    linear-gradient(145deg, #06090f 0%, #0a1120 52%, #101a2d 100%);
                color: var(--brand-text);
                font-family: Ubuntu, system-ui, sans-serif;
            }

            #bootstrap-shell {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                padding: 24px;
            }

            .bootstrap-card {
                width: min(1020px, 100%);
                border: 1px solid var(--brand-stroke);
                border-radius: 28px;
                overflow: hidden;
                background: linear-gradient(180deg, rgba(15, 24, 40, 0.86), rgba(10, 16, 28, 0.82));
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(18px);
            }

            .bootstrap-grid {
                display: grid;
                grid-template-columns: 1.15fr 0.85fr;
                min-height: 560px;
            }

            .bootstrap-brand {
                position: relative;
                padding: 42px;
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                gap: 18px;
                background:
                    radial-gradient(circle at 24% 18%, rgba(74, 167, 255, 0.3), transparent 18%),
                    radial-gradient(circle at 74% 26%, rgba(110, 231, 183, 0.24), transparent 14%),
                    linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0));
            }

            .bootstrap-brand::after {
                content: "";
                position: absolute;
                right: 12%;
                top: 18%;
                width: 240px;
                height: 240px;
                border-radius: 999px;
                background: radial-gradient(circle, rgba(244, 185, 66, 0.22), transparent 70%);
                filter: blur(24px);
                animation: drift 8s ease-in-out infinite alternate;
            }

            .bootstrap-kicker {
                position: relative;
                z-index: 1;
                letter-spacing: 0.3em;
                text-transform: uppercase;
                font-size: 12px;
                font-weight: 700;
                color: var(--brand-muted);
            }

            .bootstrap-headline {
                position: relative;
                z-index: 1;
                margin: 0;
                max-width: 460px;
                font-size: clamp(2.4rem, 4vw, 4.6rem);
                line-height: 0.93;
                letter-spacing: -0.05em;
            }

            .bootstrap-copy {
                position: relative;
                z-index: 1;
                max-width: 460px;
                margin: 0;
                color: var(--brand-muted);
                line-height: 1.65;
            }

            .bootstrap-panel {
                padding: 42px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 18px;
                background: rgba(7, 11, 19, 0.52);
            }

            .bootstrap-loader {
                width: 72px;
                height: 72px;
                border-radius: 22px;
                display: grid;
                place-items: center;
                background: linear-gradient(145deg, rgba(74, 167, 255, 0.18), rgba(110, 231, 183, 0.18));
                border: 1px solid rgba(255, 255, 255, 0.12);
            }

            .bootstrap-loader::before {
                content: "";
                width: 34px;
                height: 34px;
                border-radius: 999px;
                border: 3px solid rgba(255, 255, 255, 0.12);
                border-top-color: var(--brand-primary);
                animation: spin 0.85s linear infinite;
            }

            .bootstrap-title {
                margin: 0;
                font-size: 1.2rem;
                font-weight: 700;
            }

            .bootstrap-text {
                margin: 0;
                color: var(--brand-muted);
                line-height: 1.6;
            }

            .bootstrap-progress {
                width: 100%;
                height: 10px;
                border-radius: 999px;
                overflow: hidden;
                background: rgba(255, 255, 255, 0.08);
            }

            .bootstrap-progress::before {
                content: "";
                display: block;
                width: 40%;
                height: 100%;
                background: linear-gradient(90deg, var(--brand-primary), var(--brand-secondary), var(--brand-accent));
                border-radius: inherit;
                animation: pulse 1.6s ease-in-out infinite;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            @keyframes pulse {
                0% { transform: translateX(-14%); }
                50% { transform: translateX(145%); }
                100% { transform: translateX(-14%); }
            }

            @keyframes drift {
                from { transform: translate3d(0, 0, 0) scale(1); }
                to { transform: translate3d(-24px, 16px, 0) scale(1.05); }
            }

            @media (max-width: 920px) {
                .bootstrap-grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>

    <body>
        <div id="bootstrap-shell" aria-live="polite">
            <div class="bootstrap-card">
                <div class="bootstrap-grid">
                    <section class="bootstrap-brand">
                        <div class="bootstrap-kicker">Accredit</div>
                        <h1 class="bootstrap-headline">Turn what you know into quizzes and credible certification.</h1>
                        <p class="bootstrap-copy">
                            Preparing the PDF, quiz, and certification workspace before your session becomes interactive.
                        </p>
                    </section>
                    <section class="bootstrap-panel">
                        <div class="bootstrap-loader" aria-hidden="true"></div>
                        <h2 class="bootstrap-title">Loading your certification workspace</h2>
                        <p class="bootstrap-text">
                            Restoring routes, theme, authentication state, and the interactive learning experience.
                        </p>
                        <div class="bootstrap-progress" aria-hidden="true"></div>
                    </section>
                </div>
            </div>
        </div>
        <script>
            window.addEventListener("flutter-first-frame", function () {
                const shell = document.getElementById("bootstrap-shell");
                if (shell) {
                    shell.remove();
                }
            });
        </script>
        <script src="flutter_bootstrap.js" async></script>
    </body>
</html>
