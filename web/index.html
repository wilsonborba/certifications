<!doctype html>
<html>
    <head>
        <!--
    Base href is replaced automatically by Flutter during build.
    Do NOT hardcode it.
  -->
        <base href="$FLUTTER_BASE_HREF" />

        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

        <!-- Primary metadata -->
        <title>Certification</title>
        <meta
            name="description"
            content="Turn what you learn into quizzes and shareable certifications."
        />

        <!-- Mobile / PWA -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Certification" />

        <!-- Icons -->
        <link rel="apple-touch-icon" href="icons/Icon-192.png" />
        <link rel="icon" type="image/png" href="favicon.png" />
        <link rel="manifest" href="manifest.json" />

        <!-- Open Graph (WhatsApp, Facebook, LinkedIn, iMessage) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Certification" />
        <meta property="og:title" content="Certification" />
        <meta
            property="og:description"
            content="Turn what you learn into quizzes and shareable certifications."
        />
        <meta property="og:url" content="https://certification.asodya.com/" />
        <meta
            property="og:image"
            content="https://certification.asodya.com/og/preview-1200x630.png"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />

        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Certification" />
        <meta
            name="twitter:description"
            content="Turn what you learn into quizzes and shareable certifications."
        />
        <meta
            name="twitter:image"
            content="https://certification.asodya.com/og/preview-1200x630.png"
        />
    </head>

    <body>
        <script src="flutter_bootstrap.js" async></script>
    </body>
</html>
