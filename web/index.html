<!doctype html>
<html>
    <head>
        <!--
    Base href is replaced automatically by Flutter during build.
    Do NOT hardcode it.
  -->
        <base href="$FLUTTER_BASE_HREF" />

        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

        <!-- Primary metadata -->
        <title>Certification</title>
        <meta
            name="description"
            content="Turn what you learn into quizzes and shareable certifications."
        />

        <!-- Mobile / PWA -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Certification" />

        <!-- Icons -->
        <link rel="apple-touch-icon" href="icons/Icon-192.png" />
        <link rel="icon" type="image/png" href="favicon.png" />
        <link rel="manifest" href="manifest.json" />

        <!-- Open Graph (WhatsApp, Facebook, LinkedIn, iMessage) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Certification" />
        <meta property="og:title" content="Certification" />
        <meta
            property="og:description"
            content="Turn what you learn into quizzes and shareable certifications."
        />
        <meta property="og:url" content="https://certification.asodya.com/" />
        <meta
            property="og:image"
            content="https://certification.asodya.com/og/preview-1200x630.png"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />

        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Certification" />
        <meta
            name="twitter:description"
            content="Turn what you learn into quizzes and shareable certifications."
        />
        <meta
            name="twitter:image"
            content="https://certification.asodya.com/og/preview-1200x630.png"
        />
        <style>
            :root {
                color-scheme: light dark;
                --brand-bg: Canvas;
                --brand-primary: CanvasText;
                --brand-secondary: CanvasText;
                --brand-accent: CanvasText;
                --brand-surface: color-mix(in srgb, Canvas 92%, CanvasText 8%);
                --brand-stroke: color-mix(in srgb, CanvasText 16%, transparent);
                --brand-text: CanvasText;
                --brand-muted: color-mix(in srgb, CanvasText 70%, transparent);
            }

            * { box-sizing: border-box; }

            html, body {
                margin: 0;
                min-height: 100%;
                background: var(--brand-bg);
                color: var(--brand-text);
                font-family: Ubuntu, system-ui, sans-serif;
            }

            #bootstrap-shell {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                padding: 24px;
            }

            .bootstrap-card {
                width: min(1020px, 100%);
                border: 1px solid var(--brand-stroke);
                border-radius: 28px;
                overflow: hidden;
                background: var(--brand-surface);
                box-shadow: 0 30px 80px color-mix(in srgb, CanvasText 22%, transparent);
                backdrop-filter: blur(18px);
            }

            .bootstrap-grid {
                display: grid;
                grid-template-columns: 1.15fr 0.85fr;
                min-height: 560px;
            }

            .bootstrap-brand {
                position: relative;
                padding: 42px;
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                gap: 18px;
                background: var(--brand-bg);
            }

            .bootstrap-brand::after {
                content: "";
                position: absolute;
                right: 12%;
                top: 18%;
                width: 240px;
                height: 240px;
                border-radius: 999px;
                background: radial-gradient(circle, color-mix(in srgb, CanvasText 18%, transparent), transparent 70%);
                filter: blur(24px);
                animation: drift 8s ease-in-out infinite alternate;
            }

            .bootstrap-kicker {
                position: relative;
                z-index: 1;
                letter-spacing: 0.3em;
                text-transform: uppercase;
                font-size: 12px;
                font-weight: 700;
                color: var(--brand-muted);
            }

            .bootstrap-headline {
                position: relative;
                z-index: 1;
                margin: 0;
                max-width: 460px;
                font-size: clamp(2.4rem, 4vw, 4.6rem);
                line-height: 0.93;
                letter-spacing: -0.05em;
            }

            .bootstrap-copy {
                position: relative;
                z-index: 1;
                max-width: 460px;
                margin: 0;
                color: var(--brand-muted);
                line-height: 1.65;
            }

            .bootstrap-panel {
                padding: 42px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 18px;
                background: var(--brand-surface);
            }

            .bootstrap-loader {
                width: 72px;
                height: 72px;
                border-radius: 22px;
                display: grid;
                place-items: center;
                background: var(--brand-bg);
                border: 1px solid var(--brand-stroke);
            }

            .bootstrap-loader::before {
                content: "";
                width: 34px;
                height: 34px;
                border-radius: 999px;
                border: 3px solid var(--brand-stroke);
                border-top-color: var(--brand-primary);
                animation: spin 0.85s linear infinite;
            }

            .bootstrap-title {
                margin: 0;
                font-size: 1.2rem;
                font-weight: 700;
            }

            .bootstrap-text {
                margin: 0;
                color: var(--brand-muted);
                line-height: 1.6;
            }

            .bootstrap-progress {
                width: 100%;
                height: 10px;
                border-radius: 999px;
                overflow: hidden;
                background: var(--brand-stroke);
            }

            .bootstrap-progress::before {
                content: "";
                display: block;
                width: 40%;
                height: 100%;
                background: var(--brand-primary);
                border-radius: inherit;
                animation: pulse 1.6s ease-in-out infinite;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            @keyframes pulse {
                0% { transform: translateX(-14%); }
                50% { transform: translateX(145%); }
                100% { transform: translateX(-14%); }
            }

            @keyframes drift {
                from { transform: translate3d(0, 0, 0) scale(1); }
                to { transform: translate3d(-24px, 16px, 0) scale(1.05); }
            }

            @media (max-width: 920px) {
                .bootstrap-grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>

    <body>
        <div id="bootstrap-shell" aria-live="polite">
            <div class="bootstrap-card">
                <div class="bootstrap-grid">
                    <section class="bootstrap-brand">
                        <div class="bootstrap-kicker">ASODYA</div>
                        <h1 class="bootstrap-headline">Certifications</h1>
                        <p class="bootstrap-copy">
                            Turn what you know into quizzes and credible certification. Preparing your workspace before it becomes interactive.
                        </p>
                    </section>
                    <section class="bootstrap-panel">
                        <div class="bootstrap-loader" aria-hidden="true"></div>
                        <h2 class="bootstrap-title">Loading your certification workspace</h2>
                        <p class="bootstrap-text">
                            Restoring routes, theme, authentication state, and the interactive learning experience.
                        </p>
                        <div class="bootstrap-progress" aria-hidden="true"></div>
                    </section>
                </div>
            </div>
        </div>
        <script>
            // Development previously registered Flutter service workers. This app
            // now serves local, fresh web resources, so remove those old workers
            // and their caches before Flutter starts. Without this migration a
            // browser can keep serving an obsolete main.dart.js forever.
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.getRegistrations().then((registrations) => {
                    registrations.forEach((registration) => registration.unregister());
                });
            }

            if ("caches" in window) {
                caches.keys().then((cacheNames) => {
                    cacheNames
                        .filter((cacheName) => cacheName.startsWith("flutter-"))
                        .forEach((cacheName) => caches.delete(cacheName));
                });
            }

            window.addEventListener("flutter-first-frame", function () {
                const shell = document.getElementById("bootstrap-shell");
                if (shell) {
                    shell.remove();
                }
            });
        </script>
        <script src="flutter_bootstrap.js" async></script>
    </body>
</html>
